specforge: 1
spec_dir: specs
default_branch: main
archive: true
# specforge's own safety rails: the build flow must never auto-merge edits to these.
# (.github/, .specforge/ and CODEOWNERS are always protected by default.)
protected_paths:
  - ^src/
  - ^dist/
  - ^skills/
  - ^agents/
  - ^lenses/
  - ^templates/
  - ^\.claude-plugin/
  - ^CLAUDE\.md$
  - ^package(-lock)?\.json$
  - ^test/
commands:
  test: npm test
  lint: ""
loops:
  spec_review_max: 3
  ci_fix_max: 5
  code_review_max: 3
review_lenses: []
exclude_lenses: []
code_review_lenses: []
exclude_code_lenses: []
