name: specforge dismiss stale approvals (reusable)
# When commits are pushed to a spec/ or build/ PR, dismiss human approvals given on older commits
# and re-request those reviewers. Opt in from a repo's caller workflow.
on:
  workflow_call:
    inputs:
      specforge_ref:
        description: Tag of specforge whose dist/ to run. Keep in step with the @ref the caller uses.
        type: string
        default: v0
jobs:
  dismiss-stale:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          repository: zalmb8/specforge
          ref: ${{ inputs.specforge_ref }}
          path: .specforge-tool
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Dismiss stale approvals
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .specforge-tool/dist/dismiss-stale.mjs "${{ github.repository }}" "${{ github.event.pull_request.number }}"
