# .specforge/config.yml
specforge: 1
spec_dir: specs
default_branch: main
archive: false               # true lets `archive` move done specs into <spec_dir>/archive/ (one archive/<id> PR each)
protected_paths: []          # extra regexes that always need a human, e.g. ^migrations/
commands:
  test: npm test
  lint: ""                   # leave empty if the repo has no lint script
loops:
  spec_review_max: 3
  ci_fix_max: 5
  code_review_max: 3
review_lenses: []            # EXTRA lenses: names of files in .specforge/lenses/. All built-in lenses always run.
exclude_lenses: []           # built-in spec lenses to skip, by name
code_review_lenses: []       # EXTRA code lenses for the build flow: files in .specforge/lenses/code/
exclude_code_lenses: []      # built-in code lenses to skip, by name
